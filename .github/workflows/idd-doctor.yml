concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
name: IDD doctor health gate
# Repository-health gate: runs idd-doctor and fails the build on any
# idd-doctor error (config/doc/marker-prefix/required-file regressions).
# This does NOT enforce the disposable-worktree rule -- a primary-worktree
# B1 violation leaves no trace in pushed history and CI checks out a
# detached HEAD, so the worktree-head check never fires here. Worktree
# enforcement is local only.
on:
  pull_request:
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  idd-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Stages the pull request merge result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deliberately the ephemeral merge commit, not the head commit:
          # checks repository health as it would look after merging, and
          # keeps behavior stable if a push trigger is ever added
          # alongside pull_request (github.sha is correct for both).
          ref: ${{ github.sha }}
          # Full history and tags: the default fetch-depth: 1 shallow
          # checkout hides tag refs, which silently skips idd-doctor's
          # release-tag-drift check (git describe --tags).
          fetch-depth: 0
          persist-credentials: false
      - name: Setup the pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - name: Prepare the Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          check-latest: true
          node-version-file: .node-version
      - env:
          HUSKY: 0
        name: Install the dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run idd-doctor repository-health check
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec idd-doctor
