name: ✨ Feature request
description: Suggest an idea for this project
labels: enhancement
body:
  - type: markdown
    attributes:
      value: |
        🇺🇸🇬🇧 At first, read the following document:
        https://github.com/kurone-kito/lints-config/blob/main/.github/CONTRIBUTING.md

        🇯🇵 投稿の前に下記のドキュメントを一読ください:
        https://github.com/kurone-kito/lints-config/blob/main/.github/CONTRIBUTING.ja.md

        🇨🇳 首先，阅读以下文档:
        https://github.com/kurone-kito/lints-config/blob/main/.github/CONTRIBUTING.zh.md

  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request!

        Before you continue filling out this report, please take a moment to check that your feature request has not been [already reported on GitHub](https://github.com/kurone-kito/lints-config/search?q=is%3Aissue&type=issues) 🙌

  - type: dropdown
    id: package
    attributes:
      label: Target Package
      description: Which package does this feature request target?
      options:
        - '@kurone-kito/biome-config'
        - '@kurone-kito/commitlint-config'
        - '@kurone-kito/cspell-config'
        - '@kurone-kito/lint-staged-config'
        - '@kurone-kito/markdownlint-config'
        - Repository tooling / multiple packages
        - Not sure
    validations:
      required: true

  - type: textarea
    id: overview
    attributes:
      label: Feature Overview
      description: A clear and concise description of what the feature request is.
      placeholder: I would like this package to add/support a rule for "X", or support a new version of the underlying tool.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Detail any potential alternative solutions/workarounds you've used or considered.
      placeholder: I have worked around this by overriding "X" in my own project config that loads this package (whether via `extends`, `import`, or a re-exported config file).

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here. Remove
        any secrets, credentials, tokens, or personal data before
        submitting.
      placeholder: Feel free to add any other context here, such as a link to the underlying tool's own documentation for the rule/option you're requesting, that you think might be relevant to this feature request.
