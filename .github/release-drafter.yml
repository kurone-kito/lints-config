name-template: v$NEXT_PATCH_VERSION 🌈
tag-template: v$NEXT_PATCH_VERSION
# Categories below must only match labels this repository actually
# applies. IDD's reserved labels (roadmap, status:*, idd:ready — see
# docs/idd-policy.md § Label Names) are deliberately not category
# labels here; do not add them.
categories:
  - title: 🚀 Features
    label: enhancement
  - title: 🐛 Bug Fixes
    label: bug
  - title: 📝 Documentation
    label: documentation
  - title: 🧰 Maintenance
    label: dependencies
    collapse-after: 5
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
template: |
  ## Changes

  $CHANGES
