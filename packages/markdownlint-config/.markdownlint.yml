default: true
# Allow limit breakthroughs in the code block and table row lengths. The
# default is unconditional prohibition. It is exceptionally allowed in
# these elements due to folding difficulties.
line-length:
  code_blocks: false
  headings: false
  tables: false
# Detects duplicate headings only among siblings sharing the same parent
# section (MD024's `siblings_only` option), which allows the same heading
# text to repeat under different parents (e.g. changelog entries). Reproduced
# as working correctly against the pinned markdownlint toolchain; see #252.
no-duplicate-heading:
  siblings_only: true
# Allows embedding of the specified HTML tag. The default is unconditional
# prohibition. Allow for some valuable features, such as folding.
no-inline-html:
  allowed_elements:
    - details
    - summary
