allowBuilds:
  # kurone-kito/idd-skill's only lifecycle script is `prepare: husky`
  # (git-hooks setup); reviewed and pinned to a specific commit (#174).
  '@kurone-kito/idd-skill@https://codeload.github.com/kurone-kito/idd-skill/tar.gz/f515fc34befc9026bdce4686fc6e41cc90e15c1d': true
configDependencies:
  '@pnpm/plugin-types-fixer': 0.1.0+sha512-bLww63gRHi7siYTqFJb5qNdcXadU0jv20Et6z5AryMZ7FlLolbEJOrXLpg8+amQZNHHNW1dfFUBGVw/9ezQbFg==
enableGlobalVirtualStore: true
engineStrict: true
gitChecks: false
ignoreWorkspaceRootCheck: true
linkWorkspacePackages: true
packages:
  - packages/*
pmOnFail: warn
shellEmulator: true

# Prevent parallel execution of publish. Since no `--workspace-concurrency`
# option exists for pnpm publish, keep this at 1 to serialize publishes;
# only raise it if that policy changes.
workspaceConcurrency: 1
