name: The CI workflow on merge as a main branch
run-name: Merged the main branch by @${{ github.actor }}
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: write
jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # The autolabeler below only ever adds a label, never removes one
      # (release-drafter v7.7.0). Clearing the three category labels it
      # manages first, every run, means a re-run after a title edit
      # (feat: -> fix:, etc.) always ends with exactly the label(s) the
      # current title matches, not a stale label left from an earlier
      # title alongside the new one.
      - if: ${{ github.event_name == 'pull_request' }}
        name: Clear the managed category labels before relabeling
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for label in enhancement bug documentation; do
            gh pr edit "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" \
              --remove-label "$label"
          done
      - if: ${{ github.event_name == 'pull_request' }}
        name: Apply the autolabeler rules to this pull request
        uses: release-drafter/release-drafter/autolabeler@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
