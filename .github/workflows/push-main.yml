name: The CI workflow on merge as a main branch, and PR labeling
run-name: "${{ github.event_name == 'push' && format('Merged the main branch by @{0}', github.actor) || format('Labeled PR #{0} by @{1}', github.event.pull_request.number, github.actor) }}"
on:
  push:
    branches:
      - main
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
    branches:
      - main
permissions:
  contents: read
jobs:
  # Trust model: this job triggers on `pull_request_target` (#289), which
  # runs with base-repository permissions even for pull requests from
  # forks -- unlike `pull_request`, where GitHub always downgrades
  # `GITHUB_TOKEN` to read-only for a fork-originated run regardless of
  # the `permissions:` declared below. That is safe here only because all
  # of the following hold, and any future edit to this job must preserve
  # them:
  #   - No PR-head content is ever checked out: this job has no
  #     `actions/checkout` step at all, and must not gain one.
  #   - No PR-head code, workflow, or action is ever executed. The
  #     autolabeler step below runs a pinned, commit-SHA-locked upstream
  #     action (`release-drafter/release-drafter/autolabeler`) that only
  #     reads the PR title as data via the GitHub API and calls the
  #     labels API -- it never checks out or executes anything from the
  #     PR diff.
  #   - The only PR-controlled value ever passed into a `run:` step is
  #     `github.event.pull_request.number`, an integer from the event
  #     payload, passed through `env:` (mirroring the `PR_NUMBER`
  #     pattern `strip-untrusted-labels.yml` already uses for the same
  #     event field) and referenced as a quoted shell variable, never
  #     interpolated into a `run:` script as a free-form `${{ }}`
  #     expression. No PR-controlled string (title, body, branch name,
  #     etc.) is ever interpolated into a `run:` script. (The `if:`
  #     guard below separately reads
  #     `github.event.pull_request.user.login` to skip Dependabot, but
  #     that is evaluated by the Actions runtime itself, never passed
  #     into a script.)
  #   - Because this job also evaluates *this workflow file itself* from
  #     the base branch by `pull_request_target` default (not the PR's
  #     own copy), a PR editing this file cannot change what the job
  #     does against its own event -- only a merge to `main` can.
  #
  # Serialized per pull request (not globally) -- an older run's
  # clear-then-add sequence must never complete after a newer run's for
  # the *same* PR, but two different PRs relabeling at the same time
  # don't conflict with each other, so they don't need to wait on one
  # another.
  #
  # Dependabot PRs are excluded (the second `if:` clause), even though
  # `pull_request_target` no longer downgrades their credentials either:
  # they already carry the `dependencies` label from Dependabot itself
  # and never match this job's feat/fix/docs title patterns anyway, so
  # running the autolabeler against them costs nothing to skip and gains
  # nothing to run. Checked against the PR's author
  # (`github.event.pull_request.user.login`), not `github.actor`: a
  # maintainer editing or reopening a Dependabot PR would otherwise be
  # the event's actor, silently defeating this guard for that PR.
  label_pull_request:
    if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    concurrency:
      group: ${{ github.workflow }}-label-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # The autolabeler below only ever adds a label, never removes one
      # (release-drafter v7.7.0). Clearing the three category labels it
      # manages first, every run, means a re-run after a title edit
      # (feat: -> fix:, etc.) always ends with exactly the label(s) the
      # current title matches, not a stale label left from an earlier
      # title alongside the new one.
      - name: Clear the managed category labels before relabeling
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          for label in enhancement bug documentation; do
            gh pr edit "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --remove-label "$label"
          done
      - name: Apply the autolabeler rules to this pull request
        uses: release-drafter/release-drafter/autolabeler@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
  # Restricted to push events only (#291): release-drafter forces
  # dry-run mode whenever a run's targetCommitish resolves to an
  # ephemeral refs/pull/*/merge commit instead of a real branch tip --
  # true of every *plain* `pull_request`-triggered run (this workflow no
  # longer declares that trigger at all -- see label_pull_request above,
  # #289) -- so such a run never actually mutates the draft release.
  # This dry-run explanation is retained as historical context for #291;
  # see the `pull_request_target` note below it for why this job stays
  # safely excluded from that trigger today. Worse, it used to share the
  # same concurrency group as mutating push runs below, so a no-op
  # pull_request run could displace an already-queued mutating push
  # run, silently dropping a real update. Consecutive push runs still
  # write the same single draft release, so this job keeps one global,
  # queued (cancel-in-progress: false) concurrency group across them --
  # unlike labeling above, these runs must never run in parallel with
  # each other, or a race can leave the draft with a stale snapshot.
  #
  # The `if:` below is what actually excludes label_pull_request's
  # `pull_request_target` runs (#289) from this job -- not the dry-run
  # behavior described above, which does not apply here:
  # `pull_request_target` resolves targetCommitish to the real
  # `refs/heads/main` tip, not an ephemeral merge ref, so a
  # `pull_request_target` run would NOT be forced into dry-run if it
  # ever reached this job. Keep the explicit `event_name == 'push'`
  # check; do not rely on dry-run alone to keep this job push-only.
  update_release_draft:
    if: ${{ github.event_name == 'push' }}
    concurrency:
      group: ${{ github.workflow }}-draft
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
