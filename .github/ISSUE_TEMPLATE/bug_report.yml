name: 🐛 Bug report
description: Create a report to help us improve
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        🇺🇸🇬🇧 At first, read the following document:
        https://github.com/kurone-kito/lints-config/blob/main/.github/CONTRIBUTING.md

        🇯🇵 投稿の前に下記のドキュメントを一読ください:
        https://github.com/kurone-kito/lints-config/blob/main/.github/CONTRIBUTING.ja.md

        🇨🇳 首先，阅读以下文档:
        https://github.com/kurone-kito/lints-config/blob/main/.github/CONTRIBUTING.zh.md

  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        Before you continue filling out this report, please take a moment to check that your bug has not been [already reported on GitHub](https://github.com/kurone-kito/lints-config/search?q=is%3Aissue&type=issues) 🙌

  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      description: Which package does this bug affect?
      options:
        - '@kurone-kito/biome-config'
        - '@kurone-kito/commitlint-config'
        - '@kurone-kito/cspell-config'
        - '@kurone-kito/lint-staged-config'
        - '@kurone-kito/markdownlint-config'
        - Repository tooling / multiple packages
        - Not sure
    validations:
      required: true

  - type: textarea
    id: overview
    attributes:
      label: Bug Overview
      description: A clear and concise overview of the bug.
      placeholder: When I run the lint/format command, "X" happens instead of "Y".
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: When I run the lint/format command against my config, I expect "Y" to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce the Bug
      description: Detail the series of steps required to reproduce the bug.
      placeholder: |
        1. Load the selected package's configuration in my project (e.g. `extends`/`import` it, or use it as my `.lintstagedrc.mjs` export, depending on the package): [paste the relevant snippet]
        2. Run: [e.g. `pnpm exec biome check .`/`pnpm exec cspell lint .`/etc...]
        3. The command reports/formats: [actual output]
        4. I expected it to report/format: [expected output]
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Version Details
      description: Please provide the affected package, tool, package
        manager, and Node.js versions. Remove any secrets, credentials,
        tokens, or personal data before submitting.
      placeholder: |
        - Affected package version: [e.g. @kurone-kito/biome-config@1.4.3]
        - Underlying tool version: [e.g. Biome 2.5.9/CSpell 10.0.1/commitlint 21.2.2/lint-staged 17.3.0/markdownlint-cli2 0.23.2]
        - Package manager and version: [e.g. pnpm 12.4.0]
        - Node.js version: [e.g. 22.23.2]
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here. Remove
        any secrets, credentials, tokens, or personal data before
        submitting.
      placeholder: Feel free to add any other context here, such as a link to your full config file, related CI logs, or a minimal reproduction repository, that you think might be relevant to this bug.
