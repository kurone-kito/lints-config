'$schema': ./node_modules/@biomejs/biome/configuration_schema.json
assist:
  actions:
    source:
      organizeImports: 'on'
css:
  parser:
    tailwindDirectives: true
files:
  ignoreUnknown: true
  includes:
    - '**'
    - '!**/.*ignore'
    - '!**/biome.json'
    - '!**/biome.jsonc'
    - '!**/package-lock.json'
    - '!**/pnpm-lock.yaml'
    - '!**/yarn.lock'
formatter:
  # Compatible with Prettier
  indentStyle: space
javascript:
  formatter:
    # Compatible with Prettier
    quoteStyle: single
linter:
  enabled: true
  rules:
    complexity:
      # @kurone-kito/typescript-config sets
      # noPropertyAccessFromIndexSignature, which requires bracket
      # notation for index-signature-derived properties (TS4111).
      # useLiteralKeys pushes the opposite direction (dot notation),
      # so the two structurally conflict regardless of tool version.
      useLiteralKeys: 'off'
root: false
vcs:
  clientKind: git
  enabled: true
  useIgnoreFile: true
