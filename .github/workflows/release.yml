name: Publish the packages
run-name: Publish by @${{ github.actor }}
on:
  release:
    types:
      - published
  workflow_dispatch:
jobs:
  build:
    permissions:
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/common-release.yml
    with:
      next: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease }}
